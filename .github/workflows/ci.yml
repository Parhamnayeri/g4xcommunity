name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify CI
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      NODE_ENV: test
      STAGING_MODE: 'true'
      HOST: '127.0.0.1'
      PORT: '3000'
      DATABASE_URL: 'file:./staging/staging.db'
      # Financial and external safety feature gates strictly set to the exact string "false"
      ESCROW_RELEASE_ENABLED: 'false'
      FINANCE_V2_LIVE_CREDITS_ENABLED: 'false'
      FINANCE_V2_LIVE_PAYOUTS_ENABLED: 'false'
      FINANCE_V2_P2P_SETTLEMENT_ENABLED: 'false'
      NOWPAYMENTS_LIVE_COLLECTION_ENABLED: 'false'
      RAIDERIO_LIVE_SYNC_ENABLED: 'false'
      # Synthetic mock credentials
      DISCORD_TOKEN: 'mock_ci_discord_bot_token_do_not_connect'
      DISCORD_CLIENT_ID: '100000000000000001'
      DISCORD_GUILD_ID: '100000000000000002'
      ZARINPAL_MERCHANT_ID: 'mock_zarinpal_merchant_id_do_not_connect'
      NOWPAYMENTS_API_KEY: 'mock_nowpayments_api_key_do_not_connect'
      NOWPAYMENTS_MODE: 'disabled'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate cryptographically random runtime secrets
        run: |
          mkdir -p prisma/staging
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');

            const sessionSecret = crypto.randomBytes(32).toString('hex');
            const ownerKey = crypto.randomBytes(32).toString('hex');
            const withdrawalSecret = crypto.randomBytes(32).toString('hex');
            const exchangeSecret = crypto.randomBytes(32).toString('hex');

            // Mask all generated secrets in GitHub Actions logs
            console.log('::add-mask::' + sessionSecret);
            console.log('::add-mask::' + ownerKey);
            console.log('::add-mask::' + withdrawalSecret);
            console.log('::add-mask::' + exchangeSecret);

            // Append to GitHub Actions environment
            const envFile = process.env.GITHUB_ENV;
            if (envFile) {
              const envLines = [
                'SESSION_SECRET=' + sessionSecret,
                'G4X_OWNER_ACCESS_KEY=' + ownerKey,
                'WITHDRAWAL_QUOTE_SIGNING_SECRET=' + withdrawalSecret,
                'EXCHANGE_QUOTE_SIGNING_SECRET=' + exchangeSecret
              ].join('\n') + '\n';
              fs.appendFileSync(envFile, envLines);
            }

            // Write matching .env.staging
            const stagingLines = [
              'NODE_ENV=test',
              'STAGING_MODE=true',
              'HOST=127.0.0.1',
              'PORT=3000',
              'WEB_BASE_URL=http://127.0.0.1:3000',
              'COOKIE_SECURE=false',
              'DATABASE_URL=file:./staging/staging.db',
              'DISCORD_TOKEN=mock_ci_discord_bot_token_do_not_connect',
              'DISCORD_CLIENT_ID=100000000000000001',
              'DISCORD_GUILD_ID=100000000000000002',
              'SESSION_SECRET=' + sessionSecret,
              'G4X_OWNER_ACCESS_KEY=' + ownerKey,
              'WITHDRAWAL_QUOTE_SIGNING_SECRET=' + withdrawalSecret,
              'EXCHANGE_QUOTE_SIGNING_SECRET=' + exchangeSecret,
              'ESCROW_RELEASE_ENABLED=false',
              'FINANCE_V2_LIVE_CREDITS_ENABLED=false',
              'FINANCE_V2_LIVE_PAYOUTS_ENABLED=false',
              'FINANCE_V2_P2P_SETTLEMENT_ENABLED=false',
              'NOWPAYMENTS_LIVE_COLLECTION_ENABLED=false',
              'RAIDERIO_LIVE_SYNC_ENABLED=false',
              'NOWPAYMENTS_MODE=disabled',
              'NOWPAYMENTS_API_KEY=mock_nowpayments_api_key_do_not_connect',
              'ZARINPAL_MERCHANT_ID=mock_zarinpal_merchant_id_do_not_connect'
            ];
            fs.writeFileSync('.env.staging', stagingLines.join('\n') + '\n');
          "

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application (TypeScript & Vite)
        run: npm run build

      - name: Run isolated staging verification suite
        run: npm run test:staging

      - name: Run migration & reconciliation safety suite
        run: npm run test:migration:safety

      - name: Run central permissions & authorization suite
        run: npm run test:permissions

      - name: Run Discord command registry suite
        run: npm run test:discord-commands

      - name: Run Discord order workflow concurrency suite
        run: npm run test:discord-order-workflow

      - name: Run Discord booster hub & proof suite
        run: npm run test:booster-hub

      - name: Run rules CMS & Discord synchronization suite
        run: npm run test:rules-cms

      - name: Run safe Discord Lab integration safety suite
        run: npm run test:discord-lab:safety

      - name: Run Operational Closed Beta v0.001 regression suite
        run: npm run test:beta:operational

      - name: Run Operational Closed Beta web & core acceptance suite
        run: npm run test:beta:acceptance

      - name: Run withdrawal workflow and security suite
        env:
          DATABASE_URL: file:./staging/ci_withdraw.db
          ESCROW_RELEASE_ENABLED: 'false'
          FINANCE_V2_LIVE_CREDITS_ENABLED: 'false'
          FINANCE_V2_LIVE_PAYOUTS_ENABLED: 'false'
          FINANCE_V2_P2P_SETTLEMENT_ENABLED: 'false'
          NOWPAYMENTS_LIVE_COLLECTION_ENABLED: 'false'
          RAIDERIO_LIVE_SYNC_ENABLED: 'false'
          NOWPAYMENTS_MODE: disabled
        run: |
          trap 'rm -f prisma/staging/ci_withdraw.db*' EXIT
          rm -f prisma/staging/ci_withdraw.db*
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npx ts-node src/database/seed.ts
          npm run test:withdraw

      - name: Run Discord order publication and presign suite
        env:
          DATABASE_URL: file:./staging/ci_orders.db
          ESCROW_RELEASE_ENABLED: 'false'
          FINANCE_V2_LIVE_CREDITS_ENABLED: 'false'
          FINANCE_V2_LIVE_PAYOUTS_ENABLED: 'false'
          FINANCE_V2_P2P_SETTLEMENT_ENABLED: 'false'
          NOWPAYMENTS_LIVE_COLLECTION_ENABLED: 'false'
          RAIDERIO_LIVE_SYNC_ENABLED: 'false'
          NOWPAYMENTS_MODE: disabled
        run: |
          trap 'rm -f prisma/staging/ci_orders.db*' EXIT
          rm -f prisma/staging/ci_orders.db*
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npx ts-node src/database/seed.ts
          npm run test:orders

      - name: Run production dependency vulnerability audit
        run: npm audit --omit=dev
