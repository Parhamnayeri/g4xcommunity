<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G4X Community — Marketplace, Gold Trading & Member Portal</title>
  <meta name="description" content="G4X Community Member Portal. Unified USD wallets, P2P funding, and Exchanger Marketplace." />
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #141721;
      --card-border: #23293a;
      --primary: #5865f2;
      --primary-hover: #4752c4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand span {
      color: var(--primary);
    }

    .user-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-success {
      background-color: var(--accent-green);
      color: #fff;
    }

    .btn-secondary {
      background-color: #2b3145;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #38405a;
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.25);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      margin-top: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }

    .tab-nav {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--primary);
      background: rgba(88, 101, 242, 0.08);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: var(--text-muted);
    }

    .stat-val {
      font-weight: 600;
      color: #fff;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
      background: #2b3145;
      color: var(--text-muted);
    }

    .badge-green {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .badge-amber {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
    }

    .badge-blue {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
    }

    .badge-purple {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }

    .badge-red {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
    }

    .badge-gray {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0f121a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(0, 0, 0, 0.1);
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      G4X <span>MARKETPLACE &amp; FINANCE</span>
    </div>
    <div class="user-nav" id="nav-container">
      <div class="loading-spinner"></div>
    </div>
  </header>

  <main id="main-content">
    <!-- Rendered dynamically via JavaScript -->
  </main>

  <footer>
    &copy; 2026 G4X Community. Balanced Double-Entry Accounting &amp; Marketplace Security.
  </footer>

  <script>
    let currentUser = null;
    let csrfToken = null;
    let activeTab = 'overview';

    async function fetchCsrfToken() {
      try {
        const res = await fetch('/api/csrf-token', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          csrfToken = data.csrfToken;
        }
      } catch (err) {
        console.error('Failed to fetch CSRF token', err);
      }
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        if (res.ok) {
          currentUser = await res.json();
          await fetchCsrfToken();
          renderDashboard();
        } else {
          currentUser = null;
          renderLogin();
        }
      } catch (err) {
        currentUser = null;
        renderLogin();
      }
    }

    async function handleLogout() {
      try {
        await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || ''
          }
        });
      } catch (err) {
        console.error('Logout error', err);
      } finally {
        window.location.href = '/';
      }
    }

    function renderLogin() {
      const nav = document.getElementById('nav-container');
      nav.innerHTML = `
        <a href="/auth/discord" class="btn btn-primary" id="login-btn">
          Login with Discord
        </a>
      `;

      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="hero-card">
          <h1 class="hero-title">G4X Exchanger Marketplace &amp; Finance V2.2</h1>
          <p class="hero-desc">
            A hardened financial infrastructure featuring verified P2P funding, independent Exchanger commissions, and Gold trade settlement workflows.
            Authenticate with Discord to manage your wallet, view exchange offers, or execute trades.
          </p>
          <a href="/auth/discord" class="btn btn-primary" style="font-size: 1.05rem; padding: 0.8rem 2rem;">
            Authenticate via Discord OAuth2
          </a>
        </div>
      `;
    }

    function isExchanger() {
      return currentUser && currentUser.roles && (currentUser.roles.includes('exchanger') || currentUser.roles.includes('owner'));
    }

    function isBooster() {
      return currentUser && currentUser.roles && (currentUser.roles.includes('booster') || currentUser.roles.includes('pilot') || currentUser.roles.includes('owner') || currentUser.roles.includes('admin'));
    }

    function isAdvertiser() {
      return currentUser && currentUser.roles && (currentUser.roles.includes('advertiser') || currentUser.roles.includes('owner') || currentUser.roles.includes('admin'));
    }

    function isAdmin() {
      return currentUser && currentUser.roles && (currentUser.roles.includes('admin') || currentUser.roles.includes('manager') || currentUser.roles.includes('owner'));
    }

    function renderDashboard() {
      const nav = document.getElementById('nav-container');
      nav.innerHTML = `
        <span style="font-size: 0.9rem; font-weight: 600;">${currentUser.displayName || currentUser.username}</span>
        <button class="btn btn-danger" onclick="handleLogout()" id="logout-btn">Logout</button>
      `;

      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h2 style="font-size: 1.75rem; font-weight: 800;">Financial &amp; Marketplace Hub</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Authenticated as @${currentUser.username} (${currentUser.discordId})</p>
          </div>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            ${currentUser.roles.map(r => `<span class="badge badge-green">${r}</span>`).join('')}
          </div>
        </div>

        <!-- Unified USD Wallet V2 Card -->
        <div class="dashboard-grid">
          <div class="card" id="wallet-card">
            <div class="card-title">
              <span>Unified USD Wallet (V2)</span>
              <span class="badge badge-blue">USD Cents Only</span>
            </div>
            <div id="wallet-data">
              <div class="loading-spinner"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>Security &amp; Policy Baseline</span>
              <span class="badge badge-green">Hardened V2.2</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Double-Entry Accounting</span>
              <span class="stat-val">Balanced Posting</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">P2P Settlement Gate</span>
              <span class="stat-val" style="color: var(--accent-amber);">FAIL_CLOSED (Safe)</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Live Wallet Credits</span>
              <span class="stat-val" style="color: var(--accent-amber);">DISABLED (Testing)</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Gold Wallet Balance</span>
              <span class="stat-val">Item Only (No Balance)</span>
            </div>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tab-nav">
          <button class="tab-btn ${activeTab === 'overview' ? 'active' : ''}" onclick="switchTab('overview')">Active Offers</button>
          <button class="tab-btn ${activeTab === 'sell-gold' ? 'active' : ''}" onclick="switchTab('sell-gold')">Sell Gold (Advertiser)</button>
          <button class="tab-btn ${activeTab === 'p2p-funding' ? 'active' : ''}" onclick="switchTab('p2p-funding')">P2P IRT Funding</button>
          <button class="tab-btn ${activeTab === 'booster' ? 'active' : ''}" onclick="switchTab('booster')">Booster &amp; Withdrawals</button>
          <button class="tab-btn ${activeTab === 'applications' ? 'active' : ''}" onclick="switchTab('applications')">Member Applications</button>
          ${isExchanger() ? `<button class="tab-btn ${activeTab === 'exchanger' ? 'active' : ''}" onclick="switchTab('exchanger')">Exchanger Portal</button>` : ''}
          ${isAdmin() ? `<button class="tab-btn ${activeTab === 'admin' ? 'active' : ''}" onclick="switchTab('admin')">Admin Review Hub</button>` : ''}
        </div>

        <div id="tab-content">
          <!-- Rendered via switchTab -->
        </div>
      `;

      loadWalletV2();
      switchTab(activeTab);
    }

    async function loadWalletV2() {
      const container = document.getElementById('wallet-data');
      try {
        const res = await fetch('/api/wallet/v2', { credentials: 'include' });
        if (res.ok) {
          const w = await res.json();
          container.innerHTML = `
            <div class="stat-row">
              <span class="stat-label">Available Balance</span>
              <span class="stat-val" style="color: var(--accent-green); font-size: 1.1rem;">$${(w.availableCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Reserved (In-Trade / Withdrawal)</span>
              <span class="stat-val" style="color: var(--accent-amber);">$${(w.reservedCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Pending Earnings (Hold)</span>
              <span class="stat-val">$${(w.pendingEarningsCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Confirmed Earnings</span>
              <span class="stat-val">$${(w.confirmedEarningsCents / 100).toFixed(2)}</span>
            </div>
          `;
        } else {
          container.innerHTML = `<span style="color: var(--accent-red);">Failed to load Wallet V2.</span>`;
        }
      } catch (err) {
        container.innerHTML = `<span style="color: var(--accent-red);">Wallet service unavailable.</span>`;
      }
    }

    async function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.textContent.toLowerCase().includes(tab.replace('-', ' ')));
      if (activeBtn) activeBtn.classList.add('active');

      const content = document.getElementById('tab-content');
      content.innerHTML = '<div class="loading-spinner"></div>';

      if (tab === 'overview') {
        renderOffersTab(content);
      } else if (tab === 'sell-gold') {
        renderSellGoldTab(content);
      } else if (tab === 'p2p-funding') {
        renderP2pFundingTab(content);
      } else if (tab === 'booster') {
        renderBoosterTab(content);
      } else if (tab === 'applications') {
        renderApplicationsTab(content);
      } else if (tab === 'exchanger' && isExchanger()) {
        renderExchangerTab(content);
      } else if (tab === 'admin' && isAdmin()) {
        renderAdminTab(content);
      }
    }

    async function renderOffersTab(container) {
      try {
        const res = await fetch('/api/marketplace/offers');
        const data = await res.json();
        const offers = data.offers || [];

        container.innerHTML = `
          <div class="card">
            <div class="card-title">
              <span>Active Exchanger Published Offers</span>
              <span class="badge badge-green">${offers.length} Active</span>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Offer Ref</th>
                    <th>Exchanger</th>
                    <th>Service Type</th>
                    <th>Currency</th>
                    <th>Commission</th>
                    <th>Terms / Limits</th>
                  </tr>
                </thead>
                <tbody>
                  ${offers.length === 0 ? '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No active offers published yet.</td></tr>' : 
                    offers.map(o => `
                      <tr>
                        <td><code>${o.offerRef}</code></td>
                        <td><strong>${o.exchanger.displayName || o.exchanger.username}</strong></td>
                        <td><span class="badge">${o.serviceType}</span></td>
                        <td><strong>${o.settlementCurrency}</strong></td>
                        <td style="color: var(--accent-green); font-weight: 700;">${(o.commissionPercentage * 100).toFixed(2)}%</td>
                        <td style="color: var(--text-muted);">${o.terms || 'Standard terms'}</td>
                      </tr>
                    `).join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="card"><p style="color: var(--accent-red);">Failed to load exchange offers.</p></div>`;
      }
    }

    async function renderSellGoldTab(container) {
      container.innerHTML = `
        <div class="card">
          <div class="card-title">
            <span>Sell Gold to Approved Exchanger (Workflow A &amp; B)</span>
            <span class="badge badge-blue">Advertiser is Seller</span>
          </div>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
            Advertiser sells in-game Gold. Select an approved Exchanger buyer and your preferred settlement method:
            <strong>External IRT Card/Bank (Workflow A)</strong>, <strong>External USDT (Workflow A)</strong>, or <strong>Exchanger Prepaid USD Wallet (Workflow B)</strong>.
          </p>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem;">
            <div class="form-group">
              <label>Exchanger Discord ID (Buyer)</label>
              <input type="text" class="form-control" id="gold-buyer-id" placeholder="e.g. 1234567890" />
            </div>
            <div class="form-group">
              <label>Game Slug</label>
              <input type="text" class="form-control" id="gold-game-slug" value="wow_midnight" />
            </div>
            <div class="form-group">
              <label>Gold Quantity</label>
              <input type="number" class="form-control" id="gold-quantity" placeholder="e.g. 1000000" />
            </div>
            <div class="form-group">
              <label>Agreed Valuation in USD Cents</label>
              <input type="number" class="form-control" id="gold-valuation-cents" placeholder="e.g. 8000 ($80.00)" />
            </div>
            <div class="form-group">
              <label>Settlement Method</label>
              <select class="form-control" id="gold-settlement-method">
                <option value="IRT_DIRECT">External Direct IRT Bank/Card (Workflow A)</option>
                <option value="USDT_DIRECT">External Direct USDT BEP-20 (Workflow A)</option>
                <option value="USD_WALLET">Exchanger Prepaid USD Wallet (Workflow B)</option>
              </select>
            </div>
          </div>

          <button class="btn btn-primary" onclick="requestGoldQuote()" style="margin-top: 1rem;">
            Generate Immutable Quote
          </button>

          <div id="gold-quote-result" style="margin-top: 1.5rem;"></div>
        </div>
      `;
    }

    window.requestGoldQuote = async function() {
      const buyerId = document.getElementById('gold-buyer-id').value.trim();
      const gameSlug = document.getElementById('gold-game-slug').value.trim();
      const goldQuantity = Number(document.getElementById('gold-quantity').value);
      const agreedValuationUsdCents = Number(document.getElementById('gold-valuation-cents').value);
      const settlementMethod = document.getElementById('gold-settlement-method').value;
      const resContainer = document.getElementById('gold-quote-result');

      resContainer.innerHTML = '<div class="loading-spinner"></div> Calculating quote...';

      try {
        const res = await fetch('/api/marketplace/advertiser/trades/quote', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            buyerId,
            gameSlug,
            goldQuantity,
            agreedValuationUsdCents,
            settlementMethod
          })
        });

        const data = await res.json();
        if (!res.ok) {
          resContainer.innerHTML = `<div style="color: var(--accent-red); padding: 1rem; background: rgba(239, 68, 68, 0.1); border-radius: 6px;">Quote Error: ${data.error}</div>`;
          return;
        }

        const q = data.quote;
        window.currentGoldQuote = q;

        resContainer.innerHTML = `
          <div style="background: rgba(88, 101, 242, 0.1); border: 1px solid var(--primary); padding: 1.5rem; border-radius: 8px;">
            <h4 style="color: #fff; margin-bottom: 0.5rem;">Official Gold Trade Quote</h4>
            <div class="stat-row"><span class="stat-label">Trade Reference</span><span class="stat-val"><code>${q.tradeRef}</code></span></div>
            <div class="stat-row"><span class="stat-label">Agreed USD Valuation</span><span class="stat-val">$${(q.agreedValuationUsdCents / 100).toFixed(2)}</span></div>
            <div class="stat-row"><span class="stat-label">Net Payable Amount</span><span class="stat-val" style="color: var(--accent-green); font-size: 1.1rem;">${q.quotedPayableAmount} ${q.quotedPayableCurrency}</span></div>
            <div class="stat-row"><span class="stat-label">Settlement Route</span><span class="stat-val">${q.settlementMethod}</span></div>
            <div class="stat-row"><span class="stat-label">Quote Anti-Tamper Hash</span><span class="stat-val"><code style="font-size: 0.75rem;">${q.quoteHash.substring(0, 16)}...</code></span></div>
            
            <button class="btn btn-success" onclick="acceptGoldTradeQuote()" style="margin-top: 1rem;">
              Accept Quote &amp; Confirm Trade
            </button>
          </div>
        `;
      } catch (err) {
        resContainer.innerHTML = `<span style="color: var(--accent-red);">Request failed.</span>`;
      }
    };

    window.acceptGoldTradeQuote = async function() {
      if (!window.currentGoldQuote) return;

    function updateWithdrawalPlaceholder() {

      if (method === 'usdt') {

    async function requestWithdrawalQuote() {
      const method = document.getElementById('wdr-method').value;
      const amountVal = parseFloat(document.getElementById('wdr-amount').value || '0');
      const dest = document.getElementById('wdr-destination').value.trim();
      const feedback = document.getElementById('wdr-quote-feedback');
      const preview = document.getElementById('wdr-quote-preview');

      if (amountVal <= 0 || !dest) {
        feedback.innerHTML = '<span style="color: var(--accent-red);">Please enter a valid amount and destination address.</span>';
        return;
      }

      feedback.innerHTML = '<span class="loading-spinner"></span> Generating quote...';

      try {
        const res = await fetch('/api/withdrawals/quote', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || '',
          },
          body: JSON.stringify({
            payoutMethod: method,
            requestedUsdCents: Math.round(amountVal * 100),
            destinationAddress: dest,
          }),
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          feedback.innerHTML = `<span style="color: var(--accent-red);">${data.error || 'Failed to generate quote.'}</span>`;
          preview.style.display = 'none';
          return;
        }

        feedback.innerHTML = '<span style="color: var(--accent-green);">Quote generated successfully.</span>';
        const q = data.quote;
        preview.style.display = 'block';
        preview.innerHTML = `
          <div style="background: rgba(88, 101, 242, 0.08); border: 1px solid var(--primary); border-radius: 8px; padding: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
              <strong>Quote #${q.id} (${q.withdrawalRef})</strong>
              <span class="badge ${q.simplifiedStatus.colorClass}">${q.simplifiedStatus.label}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Requested USD</span>
              <span class="stat-val">$${(q.requestedUsdCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Fixed Payout Fee</span>
              <span class="stat-val" style="color: var(--accent-amber);">$${(q.fixedFeeUsdCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Net Payable Amount</span>
              <span class="stat-val" style="color: var(--accent-green); font-size: 1.1rem;">
                ${q.quotedNetPayoutAmount} ${q.payoutMethod.toUpperCase()}
              </span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Destination</span>
              <span class="stat-val"><code>${q.destinationAddress}</code></span>
            </div>
            <div style="margin-top: 1rem;">

                Confirm &amp; Lock Funds (Reserve)

      } catch (err) {
        feedback.innerHTML = `<span style="color: var(--accent-red);">${err.message}</span>`;
      }
    }

        <div class="dashboard-grid">
          <div class="card">
            <div class="card-title">
              <span>Apply for Role / Membership</span>
              <span class="badge badge-blue">Official Verification</span>
            </div>
            <div class="form-group">
              <label>Role Category</label>
              <select id="app-category" class="form-control">
                <option value="booster">Booster (Mythic+ / Raids / FPS)</option>
                <option value="advertiser">Advertiser (Service Coordination)</option>
                <option value="exchanger">Exchanger (Currency Trading &amp; P2P)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Experience / Description</label>
              <textarea id="app-experience" class="form-control" rows="3" placeholder="Describe your gaming background, high-end achievements or exchange capabilities..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="submitApplication()" id="btn-submit-app">Submit Application</button>
            <div id="app-feedback" style="margin-top: 0.5rem;"></div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>My Active Applications</span>
              <span class="badge badge-amber">Under Review</span>
            </div>
            <div id="my-apps-table"><div class="loading-spinner"></div> Loading applications...</div>
          </div>
        </div>
      `;

      loadMyApplications();
    }

    async function submitApplication() {
      const category = document.getElementById('app-category').value;
      const experience = document.getElementById('app-experience').value.trim();
      const feedback = document.getElementById('app-feedback');

      if (!experience) {
        feedback.innerHTML = '<span style="color: var(--accent-red);">Please provide experience details.</span>';
        return;
      }

      feedback.innerHTML = '<span class="loading-spinner"></span> Submitting...';

      try {
        const res = await fetch('/api/applications', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ category, experience, introduction: experience }),
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          feedback.innerHTML = `<span style="color: var(--accent-red);">${data.error || 'Submission failed'}</span>`;
          return;
        }

        feedback.innerHTML = '<span style="color: var(--accent-green);">Application submitted successfully!</span>';
        loadMyApplications();
      } catch (err) {
        feedback.innerHTML = `<span style="color: var(--accent-red);">${err.message}</span>`;
      }
    }

    async function loadMyApplications() {
      const container = document.getElementById('my-apps-table');
      try {
        const res = await fetch('/api/applications/my', { credentials: 'include' });
        const data = await res.json();
        const apps = data.applications || [];

        if (apps.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No active applications found.</p>';
          return;
        }

        container.innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Category</th>
                  <th>Submitted</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${apps.map(a => `
                  <tr>
                    <td>#${a.id}</td>
                    <td><span class="badge">${a.category.toUpperCase()}</span></td>
                    <td>${new Date(a.submittedAt).toLocaleDateString()}</td>
                    <td><span class="badge ${a.simplifiedStatus.colorClass}">${a.simplifiedStatus.label}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<span style="color: var(--accent-red);">Failed to load applications.</span>';
      }
    }

    async function renderAdminTab(container) {
      container.innerHTML = `
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-title">
            <span>Pending Registration Applications</span>
            <span class="badge badge-amber">Admin Review</span>
          </div>
          <div id="admin-apps-table"><div class="loading-spinner"></div> Loading applications...</div>
        </div>

        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-title">
            <span>Pending Booster Withdrawals (Manual Payout Review)</span>
            <span class="badge badge-blue">Simulation Mode</span>
          </div>
          <div id="admin-wdr-table"><div class="loading-spinner"></div> Loading withdrawals...</div>
        </div>

        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-title">
            <span>Boost Order Proof Reviews &amp; Final Approvals</span>
            <span class="badge badge-purple">7-Stage Policy</span>
          </div>
          <div id="admin-orders-table"><div class="loading-spinner"></div> Loading orders...</div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>Gold Marketplace Trades Audit</span>
            <span class="badge badge-green">Hardened V2.2</span>
          </div>
          <div id="admin-trades-table"><div class="loading-spinner"></div> Loading trades...</div>
        </div>
      `;

      loadAdminApplications();
      loadAdminWithdrawals();
      loadAdminOrders();
      loadAdminTrades();
    }

    async function loadAdminApplications() {
      const container = document.getElementById('admin-apps-table');
      try {
        const res = await fetch('/api/admin/applications', { credentials: 'include' });
        const data = await res.json();
        const apps = data.applications || [];

        if (apps.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No pending applications requiring review.</p>';
          return;
        }

        container.innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Applicant</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${apps.map(a => `
                  <tr>
                    <td>#${a.id}</td>
                    <td>${a.user ? a.user.username : a.userId}</td>
                    <td><span class="badge">${a.category.toUpperCase()}</span></td>
                    <td><span class="badge ${a.simplifiedStatus.colorClass}">${a.simplifiedStatus.label}</span></td>
                    <td>
                      <button class="btn btn-success" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="reviewApp(${a.id}, 'approve')">Approve</button>
                      <button class="btn btn-danger" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="reviewApp(${a.id}, 'reject')">Reject</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<span style="color: var(--accent-red);">Failed to load admin applications.</span>';
      }
    }

    async function reviewApp(id, decision) {
      try {
        const res = await fetch(`/api/admin/applications/${id}/review`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ decision, reviewNotes: `Decision: ${decision} via Admin Hub` }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Review failed');
        alert(`Application #${id} ${decision}d successfully!`);
        loadAdminApplications();
      } catch (err) { alert(err.message); }
    }

    async function loadAdminWithdrawals() {
      const container = document.getElementById('admin-wdr-table');
      try {
        const res = await fetch('/api/admin/withdrawals', { credentials: 'include' });
        const data = await res.json();
        const withdrawals = data.withdrawals || [];

        if (withdrawals.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No pending reserved withdrawals.</p>';
          return;
        }

        container.innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Ref</th>
                  <th>Booster</th>
                  <th>Method</th>
                  <th>Reserved USD</th>
                  <th>Net Payout</th>
                  <th>Destination</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${withdrawals.map(w => `
                  <tr>
                    <td><code>${w.withdrawalRef}</code></td>
                    <td>${w.booster ? w.booster.username : w.boosterId}</td>
                    <td><span class="badge">${w.payoutMethod.toUpperCase()}</span></td>
                    <td>$${(w.requestedUsdCents / 100).toFixed(2)}</td>
                    <td style="color: var(--accent-green); font-weight: 700;">${w.quotedNetPayoutAmount}</td>
                    <td><code style="font-size: 0.8rem;">${w.destinationAddress}</code></td>
                    <td><span class="badge ${w.simplifiedStatus.colorClass}">${w.simplifiedStatus.label}</span></td>
                    <td>
                      <button class="btn btn-success" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="reviewWdr(${w.id}, 'approve_paid')">Approve Payout</button>
                      <button class="btn btn-danger" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="reviewWdr(${w.id}, 'reject')">Reject</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<span style="color: var(--accent-red);">Failed to load admin withdrawals.</span>';
      }
    }

    async function reviewWdr(id, decision) {
      try {
        const txHash = decision === 'approve_paid' ? `SIMULATED_TX_${Date.now()}` : undefined;
        const res = await fetch(`/api/admin/withdrawals/${id}/review`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ decision, txHash }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Withdrawal review failed');
        alert(`Withdrawal #${id} processed: ${decision}`);
        loadAdminWithdrawals();
      } catch (err) { alert(err.message); }
    }

    async function loadAdminOrders() {
      const container = document.getElementById('admin-orders-table');
      try {
        const res = await fetch('/api/orders/available', { credentials: 'include' });
        const data = await res.json();
        const orders = (data.orders || []).filter(o => o.status === 'completed');

        if (orders.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No orders currently requiring review or approval.</p>';
          return;
        }

        container.innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Ref</th>
                  <th>Service</th>
                  <th>Pool USD</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${orders.map(o => `
                  <tr>
                    <td><code>${o.orderRef}</code></td>
                    <td>${o.serviceName}</td>
                    <td style="color: var(--accent-green); font-weight: 700;">$${o.boosterPoolUsd}</td>
                    <td><span class="badge ${o.simplifiedStatus.colorClass}">${o.simplifiedStatus.label}</span></td>
                    <td>
                      <button class="btn btn-secondary" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="adminStaffReview(${o.id})">Staff Review</button>
                      <button class="btn btn-primary" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="adminFinalApprove(${o.id})">Final Approve</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<span style="color: var(--accent-red);">Failed to load admin orders.</span>';
      }
    }

    async function adminStaffReview(id) {
      try {
        const res = await fetch(`/api/orders/${id}/staff-review`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ notes: 'Verified via Admin Hub' }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Staff review failed');
        alert('Staff review recorded! Order can now receive Admin Final Approval.');
        loadAdminOrders();
      } catch (err) { alert(err.message); }
    }

    async function adminFinalApprove(id) {
      try {
        const res = await fetch(`/api/orders/${id}/admin-approve`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ notes: 'Final Approval granted via Admin Hub' }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Admin approval failed');
        alert('Admin Final Approval granted! 24-hour hold clock initiated.');
        loadAdminOrders();
      } catch (err) { alert(err.message); }
    }

    async function loadAdminTrades() {
      const tableContainer = document.getElementById('admin-trades-table');
      try {
        const res = await fetch('/api/marketplace/admin/trades', { credentials: 'include' });
        const data = await res.json();
        const trades = data.trades || [];

        if (trades.length === 0) {
          tableContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No recorded trades yet.</p>';
          return;
        }

        tableContainer.innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Ref</th>
                  <th>Seller (Adv)</th>
                  <th>Buyer (Exch)</th>
                  <th>Valuation</th>
                  <th>Method</th>
                  <th>Status</th>
                  <th>Delivery</th>
                  <th>Payment</th>
                </tr>
              </thead>
              <tbody>
                ${trades.map(t => `
                  <tr>
                    <td><code>${t.tradeRef}</code></td>
                    <td>${t.seller ? t.seller.username : t.sellerId}</td>
                    <td>${t.buyer ? t.buyer.username : t.buyerId}</td>
                    <td>$${(t.agreedValuationUsdCents / 100).toFixed(2)}</td>
                    <td><span class="badge">${t.settlementMethod}</span></td>
                    <td><span class="badge ${t.simplifiedStatus ? t.simplifiedStatus.colorClass : (t.tradeStatus === 'SETTLED' ? 'badge-green' : 'badge-amber')}">${t.simplifiedStatus ? t.simplifiedStatus.label : t.tradeStatus}</span></td>
                    <td>${t.goldDeliveryStatus}</td>
                    <td>${t.paymentStatus}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        tableContainer.innerHTML = '<p style="color: var(--accent-red);">Failed to load admin overview.</p>';
      }
    }

    // Start authentication check on load
    checkAuth();
  </script>
</body>
</html>
