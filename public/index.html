<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G4X Community — Marketplace, Gold Trading & Member Portal</title>
  <meta name="description" content="G4X Community Member Portal. Unified USD wallets, P2P funding, and Exchanger Marketplace." />
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #141721;
      --card-border: #23293a;
      --primary: #5865f2;
      --primary-hover: #4752c4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand span {
      color: var(--primary);
    }

    .user-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-success {
      background-color: var(--accent-green);
      color: #fff;
    }

    .btn-secondary {
      background-color: #2b3145;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #38405a;
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.25);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      margin-top: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }

    .tab-nav {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--primary);
      background: rgba(88, 101, 242, 0.08);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: var(--text-muted);
    }

    .stat-val {
      font-weight: 600;
      color: #fff;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
      background: #2b3145;
      color: var(--text-muted);
    }

    .badge-green {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .badge-amber {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
    }

    .badge-blue {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
    }

    .badge-purple {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }

    .badge-red {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
    }

    .badge-gray {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0f121a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(0, 0, 0, 0.1);
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      color: var(--text-main);
      width: 100%;
    }

    .action-btn-group {
      display: inline-flex;
      gap: 0.35rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-xs {
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 4px;
    }

    .grid-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .kpi-card {
      background: #141721;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .kpi-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .kpi-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      G4X <span>MARKETPLACE &amp; FINANCE</span>
    </div>
    <div class="user-nav" id="nav-container">
      <div class="loading-spinner"></div>
    </div>
  </header>

  <main id="main-content">
    <!-- Rendered dynamically via JavaScript -->
  </main>

  <footer>
    &copy; 2026 G4X Community. Balanced Double-Entry Accounting &amp; Marketplace Security.
  </footer>

  <script>
    let currentUser = null;
    let csrfToken = null;
    let activeTab = 'overview';

    async function fetchCsrfToken() {
      try {
        const res = await fetch('/api/csrf-token', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          csrfToken = data.csrfToken;
        }
      } catch (err) {
        console.error('Failed to fetch CSRF token', err);
      }
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        if (res.ok) {
          currentUser = await res.json();
          await fetchCsrfToken();
          renderDashboard();
        } else {
          currentUser = null;
          renderLogin();
        }
      } catch (err) {
        currentUser = null;
        renderLogin();
      }
    }

    async function handleLogout() {
      try {
        await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || ''
          }
        });
      } catch (err) {
        console.error('Logout error', err);
      } finally {
        window.location.href = '/';
      }
    }

    function renderLogin() {
      const nav = document.getElementById('nav-container');
      nav.innerHTML = `
        <a href="/auth/discord" class="btn btn-primary" id="login-btn">
          Login with Discord
        </a>
      `;

      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="hero-card">
          <h1 class="hero-title">G4X Exchanger Marketplace &amp; Finance V2.2</h1>
          <p class="hero-desc">
            A hardened financial infrastructure featuring verified P2P funding, independent Exchanger commissions, and Gold trade settlement workflows.
            Authenticate with Discord to manage your wallet, view exchange offers, or execute trades.
          </p>
          <a href="/auth/discord" class="btn btn-primary" style="font-size: 1.05rem; padding: 0.8rem 2rem;">
            Authenticate via Discord OAuth2
          </a>
        </div>
      `;
    }

    function isExchanger() {
      return currentUser && currentUser.roles && (currentUser.roles.includes('exchanger') || currentUser.roles.includes('owner'));
    }

    function isBooster() {
      return currentUser && currentUser.roles && (currentUser.roles.includes('booster') || currentUser.roles.includes('pilot') || currentUser.roles.includes('owner') || currentUser.roles.includes('admin'));
    }

    function isAdvertiser() {
      return currentUser && currentUser.roles && (currentUser.roles.includes('advertiser') || currentUser.roles.includes('owner') || currentUser.roles.includes('admin'));
    }

    function isAdmin() {
      return currentUser && currentUser.roles && (currentUser.roles.includes('admin') || currentUser.roles.includes('manager') || currentUser.roles.includes('owner'));
    }

    function renderDashboard() {
      const nav = document.getElementById('nav-container');
      nav.innerHTML = `
        <span style="font-size: 0.9rem; font-weight: 600;">${currentUser.displayName || currentUser.username}</span>
        <button class="btn btn-danger" onclick="handleLogout()" id="logout-btn">Logout</button>
      `;

      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h2 style="font-size: 1.75rem; font-weight: 800;">Financial &amp; Marketplace Hub</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Authenticated as @${currentUser.username} (${currentUser.discordId})</p>
          </div>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
            ${currentUser.roles.map(r => `<span class="badge badge-green">${r}</span>`).join('')}
            ${currentUser.advertiserRank ? `
              <span class="badge badge-blue" style="border: 1px solid rgba(59, 130, 246, 0.4);" title="Commercial Commission: ${currentUser.advertiserCommissionRateFormatted}">
                ⭐ Rank: <strong>${currentUser.advertiserRank}</strong> (${currentUser.advertiserCommissionRateFormatted} G4X Fee)
              </span>
            ` : ''}
          </div>
        </div>

        <!-- Unified USD Wallet V2 Card -->
        <div class="dashboard-grid">
          <div class="card" id="wallet-card">
            <div class="card-title">
              <span>Unified USD Wallet (V2)</span>
              <span class="badge badge-blue">USD Cents Only</span>
            </div>
            <div id="wallet-data">
              <div class="loading-spinner"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>Security &amp; Policy Baseline</span>
              <span class="badge badge-green">Hardened V2.2</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Double-Entry Accounting</span>
              <span class="stat-val">Balanced Posting</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">P2P Settlement Gate</span>
              <span class="stat-val" style="color: var(--accent-amber);">FAIL_CLOSED (Safe)</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Live Wallet Credits</span>
              <span class="stat-val" style="color: var(--accent-amber);">DISABLED (Testing)</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Gold Wallet Balance</span>
              <span class="stat-val">Item Only (No Balance)</span>
            </div>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tab-nav">
          <button class="tab-btn ${activeTab === 'overview' ? 'active' : ''}" data-tab="overview" onclick="switchTab('overview')">Active Offers</button>
          <button class="tab-btn ${activeTab === 'payments' ? 'active' : ''}" data-tab="payments" onclick="switchTab('payments')">Checkout &amp; Payments</button>
          <button class="tab-btn ${activeTab === 'sell-gold' ? 'active' : ''}" data-tab="sell-gold" onclick="switchTab('sell-gold')">Sell Gold (Advertiser)</button>
          <button class="tab-btn ${activeTab === 'p2p-funding' ? 'active' : ''}" data-tab="p2p-funding" onclick="switchTab('p2p-funding')">P2P IRT Funding</button>
          <button class="tab-btn ${activeTab === 'booster' ? 'active' : ''}" data-tab="booster" onclick="switchTab('booster')">Booster &amp; Withdrawals</button>
          <button class="tab-btn ${activeTab === 'characters-teams' ? 'active' : ''}" data-tab="characters-teams" onclick="switchTab('characters-teams')">My Characters &amp; Teams</button>
          <button class="tab-btn ${activeTab === 'applications' ? 'active' : ''}" data-tab="applications" onclick="switchTab('applications')">Member Applications</button>
          ${isExchanger() ? `<button class="tab-btn ${activeTab === 'exchanger' ? 'active' : ''}" data-tab="exchanger" onclick="switchTab('exchanger')">Exchanger Portal</button>` : ''}
          ${isAdmin() ? `<button class="tab-btn ${activeTab === 'admin' ? 'active' : ''}" data-tab="admin" onclick="switchTab('admin')">Admin Review Hub</button>` : ''}
          ${isAdmin() ? `<button class="tab-btn ${activeTab === 'games-categories' ? 'active' : ''}" data-tab="games-categories" onclick="switchTab('games-categories')">Games &amp; Categories</button>` : ''}
        </div>

        <div id="tab-content">
          <!-- Rendered via switchTab -->
        </div>
      `;

      loadWalletV2();
      switchTab(activeTab);
    }

    async function loadWalletV2() {
      const container = document.getElementById('wallet-data');
      try {
        const res = await fetch('/api/wallet/v2', { credentials: 'include' });
        if (res.ok) {
          const w = await res.json();
          container.innerHTML = `
            <div class="stat-row">
              <span class="stat-label">Available Balance</span>
              <span class="stat-val" style="color: var(--accent-green); font-size: 1.1rem;">$${(w.availableCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Reserved (In-Trade / Withdrawal)</span>
              <span class="stat-val" style="color: var(--accent-amber);">$${(w.reservedCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Pending Earnings (Hold)</span>
              <span class="stat-val">$${(w.pendingEarningsCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Confirmed Earnings</span>
              <span class="stat-val">$${(w.confirmedEarningsCents / 100).toFixed(2)}</span>
            </div>
          `;
        } else {
          container.innerHTML = `<span style="color: var(--accent-red);">Failed to load Wallet V2.</span>`;
        }
      } catch (err) {
        container.innerHTML = `<span style="color: var(--accent-red);">Wallet service unavailable.</span>`;
      }
    }

    async function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
      });

      const content = document.getElementById('tab-content');
      if (!content) return;
      content.innerHTML = '<div class="loading-spinner"></div>';

      if (tab === 'overview') {
        renderOffersTab(content);
      } else if (tab === 'payments') {
        renderPaymentsTab(content);
      } else if (tab === 'sell-gold') {
        renderSellGoldTab(content);
      } else if (tab === 'p2p-funding') {
        renderP2pFundingTab(content);
      } else if (tab === 'booster') {
        renderBoosterTab(content);
      } else if (tab === 'characters-teams') {
        renderCharactersAndTeamsTab(content);
      } else if (tab === 'applications') {
        renderApplicationsTab(content);
      } else if (tab === 'exchanger' && isExchanger()) {
        renderExchangerTab(content);
      } else if (tab === 'admin' && isAdmin()) {
        renderAdminTab(content);
      } else if (tab === 'games-categories' && isAdmin()) {
        renderGamesCategoriesTab(content);
      }
    }

    async function renderOffersTab(container) {
      try {
        const res = await fetch('/api/marketplace/offers');
        const data = await res.json();
        const offers = data.offers || [];

        container.innerHTML = `
          <div class="card">
            <div class="card-title">
              <span>Active Exchanger Published Offers</span>
              <span class="badge badge-green">${offers.length} Active</span>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Offer Ref</th>
                    <th>Exchanger</th>
                    <th>Service Type</th>
                    <th>Currency</th>
                    <th>Commission</th>
                    <th>Terms / Limits</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${offers.length === 0 ? '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No active offers published yet.</td></tr>' : 
                    offers.map(o => `
                      <tr>
                        <td><code>${o.offerRef}</code></td>
                        <td><strong>${o.exchanger.displayName || o.exchanger.username}</strong></td>
                        <td><span class="badge">${o.serviceType}</span></td>
                        <td><strong>${o.settlementCurrency}</strong></td>
                        <td style="color: var(--accent-green); font-weight: 700;">${(o.commissionPercentage * 100).toFixed(2)}%</td>
                        <td style="color: var(--text-muted);">${o.terms || 'Standard terms'}</td>
                        <td>
                          <button class="btn btn-secondary" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;" onclick="selectOfferForTrade('${o.exchanger.discordId || o.exchangerId}', '${o.settlementCurrency}')">Sell Gold</button>
                        </td>
                      </tr>
                    `).join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="card"><p style="color: var(--accent-red);">Failed to load exchange offers.</p></div>`;
      }
    }

    window.selectOfferForTrade = function(buyerId, currency) {
      switchTab('sell-gold');
      setTimeout(() => {
        const buyerInput = document.getElementById('gold-buyer-id');
        if (buyerInput) buyerInput.value = buyerId;
        const methodInput = document.getElementById('gold-settlement-method');
        if (methodInput) {
          if (currency === 'USDT') methodInput.value = 'USDT_DIRECT';
          else if (currency === 'IRT') methodInput.value = 'IRT_DIRECT';
          else if (currency === 'USD') methodInput.value = 'USD_WALLET';
        }
      }, 100);
    };

    async function renderSellGoldTab(container) {
      container.innerHTML = `
        <div class="card">
          <div class="card-title">
            <span>Sell Gold to Approved Exchanger (Workflow A &amp; B)</span>
            <span class="badge badge-blue">Advertiser is Seller</span>
          </div>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
            Advertiser sells in-game Gold. Select an approved Exchanger buyer and your preferred settlement method:
            <strong>External IRT Card/Bank (Workflow A)</strong>, <strong>External USDT (Workflow A)</strong>, or <strong>Exchanger Prepaid USD Wallet (Workflow B)</strong>.
          </p>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem;">
            <div class="form-group">
              <label>Exchanger Discord ID (Buyer)</label>
              <input type="text" class="form-control" id="gold-buyer-id" placeholder="e.g. 1234567890" />
            </div>
            <div class="form-group">
              <label>Game Slug</label>
              <input type="text" class="form-control" id="gold-game-slug" value="wow_midnight" />
            </div>
            <div class="form-group">

    async function requestWithdrawalQuote() {
      const method = document.getElementById('wdr-method').value;
      const amountVal = parseFloat(document.getElementById('wdr-amount').value || '0');
      const dest = document.getElementById('wdr-destination').value.trim();
      const feedback = document.getElementById('wdr-quote-feedback');
      const preview = document.getElementById('wdr-quote-preview');

      if (amountVal <= 0 || !dest) {
        feedback.innerHTML = '<span style="color: var(--accent-red);">Please enter a valid amount and destination address.</span>';
        return;
      }

      feedback.innerHTML = '<span class="loading-spinner"></span> Generating quote...';

      try {
        const res = await fetch('/api/withdrawals/quote', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || '',
          },
          body: JSON.stringify({
            payoutMethod: method,
            requestedUsdCents: Math.round(amountVal * 100),
            destinationAddress: dest,
          }),
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          feedback.innerHTML = `<span style="color: var(--accent-red);">${data.error || 'Failed to generate quote.'}</span>`;
          preview.style.display = 'none';
          return;
        }

        feedback.innerHTML = '<span style="color: var(--accent-green);">Quote generated successfully.</span>';
        const q = data.quote;
        preview.style.display = 'block';
        preview.innerHTML = `
          <div style="background: rgba(88, 101, 242, 0.08); border: 1px solid var(--primary); border-radius: 8px; padding: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
              <strong>Quote #${q.id} (${q.withdrawalRef})</strong>
              <span class="badge ${q.simplifiedStatus.colorClass}">${q.simplifiedStatus.label}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Requested USD</span>
              <span class="stat-val">$${(q.requestedUsdCents / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Fixed Payout Fee</span>
              <span class="stat-val" style="color: var(--accent-amber);">$${(q.fixedFeeUsdCents / 100).toFixed(2)}</span>
            </div>

              <span class="stat-label">Net Payable Amount</span>
              <span class="stat-val" style="color: var(--accent-green); font-size: 1.1rem;">

      }
    }

    async function submitOrderProof(orderId) {
      const evidenceUrl = prompt('Enter screenshot image URL or proof reference:');
      if (!evidenceUrl || !evidenceUrl.trim()) return;
      const description = prompt('Enter completion notes (optional):') || '';
      try {
        const proofsRes = await fetch(`/api/orders/${orderId}/proofs`, { credentials: 'include' });
        const proofsData = await proofsRes.json();
        const runId = proofsData.proofs && proofsData.proofs[0] ? proofsData.proofs[0].runId : 1;
        const res = await fetch(`/api/orders/${orderId}/proofs`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ runId, evidenceUrl: evidenceUrl.trim(), description: description.trim() }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Failed to submit proof');
        alert('Proof submitted successfully! It is now pending Staff review.');
        loadAvailableOrders();
      } catch (err) { alert(err.message); }
    }

    async function openDisputeModal(orderId) {
      const disputeType = prompt('Select dispute reason:\n1: completion\n2: quality\n3: misconduct\n4: key_failure\n5: payment\n6: other', 'completion');
      if (!disputeType) return;
      const typeMap = { '1': 'completion', '2': 'quality', '3': 'misconduct', '4': 'key_failure', '5': 'payment', '6': 'other' };
      const selectedType = typeMap[disputeType] || disputeType;
      const description = prompt('Provide a clear explanation of the issue (minimum 5 characters):');
      if (!description || description.trim().length < 5) return alert('Explanation must be at least 5 characters.');
      const evidenceUrl = prompt('Evidence screenshot or URL (optional):') || '';
      try {
        const res = await fetch(`/api/orders/${orderId}/disputes`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ disputeType: selectedType, description: description.trim(), evidenceUrl: evidenceUrl.trim() || undefined }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Failed to open dispute');
        alert(`Dispute #${data.dispute.id} opened successfully! Financial release has been paused and Staff notified.`);
        loadAvailableOrders();
      } catch (err) { alert(err.message); }
    }

    async function submitAddCharacter() {
      const region = document.getElementById('char-new-region').value;
      const realm = document.getElementById('char-new-realm').value.trim();
      const characterName = document.getElementById('char-new-name').value.trim();
      const feedback = document.getElementById('add-char-feedback');

      if (!realm || !characterName) {
        feedback.innerHTML = '<span style="color: var(--accent-red);">Please enter realm and character name.</span>';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Verifying on Raider.IO...';
      feedback.innerHTML = '';

      try {
        const res = await fetch('/api/characters/add', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ region, realm, characterName }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) {

        feedback.innerHTML = `<span style="color: var(--accent-green);">Character <strong>${data.character.characterName}</strong> added successfully!</span>`;

      } catch (err) {
        feedback.innerHTML = `<span style="color: var(--accent-red);">${err.message || 'Error adding character'}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Verify & Add Character (Raider.IO)';
      }
    }

    async function loadTeamsList() {
      const container = document.getElementById('teams-list-container');

      if (!container) return;

      try {
        const res = await fetch('/api/teams', { credentials: 'include' });
        if (!res.ok) throw new Error('Failed to load teams');
        const teams = await res.json();

        if (badge) badge.innerText = `${teams.length} Squad(s)`;

        if (teams.length === 0) {
          container.innerHTML = `<div style="color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0;">You are not in any premade squads yet. Create one below!</div>`;
          return;
        }

        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            ${teams.map(t => {
              const myId = currentUser ? currentUser.discordId : '';
              const isLeader = t.leaderId === myId;
              const myMembership = (t.members || []).find(m => m.userId === myId);
              const isPending = myMembership && myMembership.status === 'pending';
              const isAccepted = myMembership && myMembership.status === 'accepted';

              return `
                <div style="border: 1px solid var(--border-color); border-radius: 6px; padding: 0.75rem; background: var(--card-bg-subtle, rgba(255,255,255,0.02));">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <div>
                      <strong style="font-size: 1rem;">${t.teamName}</strong>
                      <span class="badge badge-blue" style="margin-left: 0.3rem;">${t.squadType.toUpperCase()}</span>
                      ${isLeader ? '<span class="badge badge-green" style="margin-left: 0.3rem;">LEADER</span>' : ''}
                    </div>
                    <div>
                      ${isPending ? `
                        <button class="btn btn-primary" style="padding: 0.2rem 0.6rem; font-size: 0.75rem;" onclick="acceptTeamInvite(${t.id})">Accept Invite</button>
                        <button class="btn btn-secondary" style="padding: 0.2rem 0.6rem; font-size: 0.75rem; color: var(--accent-red);" onclick="declineTeamInvite(${t.id})">Decline</button>
                      ` : ''}
                      ${isAccepted ? `
                        <button class="btn btn-secondary" style="padding: 0.2rem 0.6rem; font-size: 0.75rem;" onclick="leaveTeamSubmit(${t.id})">Leave Squad</button>
                      ` : ''}
                      ${isLeader ? `
                        <button class="btn btn-secondary" style="padding: 0.2rem 0.6rem; font-size: 0.75rem;" onclick="promptInviteMember(${t.id})">Invite</button>
                        <button class="btn btn-secondary" style="padding: 0.2rem 0.6rem; font-size: 0.75rem; color: var(--accent-red);" onclick="disbandTeamSubmit(${t.id})">Disband</button>
                      ` : ''}
                    </div>
                  </div>
                  <div style="font-size: 0.85rem; color: var(--text-muted);">
                    <strong>Members (${t.members.length}):</strong>
                    ${t.members.map(m => `
                      <span style="display: inline-block; margin-right: 0.5rem; ${m.status === 'pending' ? 'opacity: 0.6;' : ''}">
                        • ${m.displayName || m.username || m.userId} [${m.memberRole || 'booster'}] (${m.status})
                      </span>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div style="color: var(--accent-red); font-size: 0.9rem;">${err.message || 'Error loading teams'}</div>`;
      }
    }

    async function submitCreateTeam() {
      const teamName = document.getElementById('team-new-name').value.trim();
      const squadType = document.getElementById('team-new-type').value;
      const feedback = document.getElementById('create-team-feedback');
      const btn = document.getElementById('btn-create-team');

      if (!teamName) {
        feedback.innerHTML = '<span style="color: var(--accent-red);">Please enter a team name.</span>';
        return;

      btn.disabled = true;
      feedback.innerHTML = '';

      try {
        const res = await fetch('/api/teams/create', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ teamName, squadType }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Failed to create squad');

        feedback.innerHTML = `<span style="color: var(--accent-green);">Squad <strong>${data.squad.teamName}</strong> created successfully!</span>`;

        feedback.innerHTML = `<span style="color: var(--accent-red);">${err.message || 'Error creating squad'}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    async function adminRequestDisputeEvidence(disputeId) {
      const requestNotes = prompt('Enter specific evidence or information requested from participants:');
      if (!requestNotes || !requestNotes.trim()) return;
      try {
        const res = await fetch(`/api/admin/disputes/${disputeId}/request-evidence`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ requestNotes: requestNotes.trim() }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Request failed');
        alert('Evidence request submitted and posted to coordination channel!');
        loadAdminDisputes();
      } catch (err) { alert(err.message); }
    }

    async function adminAddDisputeNotes(disputeId) {
      const notes = prompt('Enter internal review note:');
      if (!notes || !notes.trim()) return;
      try {
        const res = await fetch(`/api/admin/disputes/${disputeId}/notes`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ notes: notes.trim() }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Failed to add note');
        alert('Note added to dispute.');
        loadAdminDisputes();
      } catch (err) { alert(err.message); }
    }

    async function adminResolveDispute(disputeId) {
      const decision = prompt('Enter resolution decision ("resolved", "rejected", or "cancelled"):', 'resolved');
      if (!decision || !['resolved', 'rejected', 'cancelled'].includes(decision.toLowerCase())) {
        return alert('Invalid decision. Must be resolved, rejected, or cancelled.');
      }
      const resolutionNotes = prompt('Enter mandatory explanation and resolution terms:');
      if (!resolutionNotes || resolutionNotes.trim().length < 5) {
        return alert('A non-empty resolution explanation (min 5 chars) is mandatory.');
      }
      try {
        const res = await fetch(`/api/admin/disputes/${disputeId}/resolve`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ decision: decision.toLowerCase(), resolutionNotes: resolutionNotes.trim() }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || 'Failed to resolve dispute');
        alert(`Dispute #${disputeId} marked as ${decision.toUpperCase()}.`);
        loadAdminDisputes();
      } catch (err) { alert(err.message); }
    }

    async function adminViewDisputeAudit(disputeId) {
      try {
        const res = await fetch(`/api/admin/disputes/${disputeId}/audit-history`, { credentials: 'include' });
        const data = await res.json();
        const logs = data.history || [];
        alert(`Dispute #${disputeId} Audit Trail (${logs.length} entries):\n` +
          logs.map(l => `• ${new Date(l.createdAt).toLocaleTimeString()}: ${l.action} by ${l.actor ? l.actor.username : l.actorId || 'System'}`).join('\n')
        );
      } catch (err) { alert(err.message); }
    }

    async function updateBatchCreationPreview() {
      const platform = document.getElementById('create-batch-platform-select')?.value || 'g2g';
      const checkboxes = document.querySelectorAll('.eligible-order-checkbox:checked');
      const previewContainer = document.getElementById('batch-preview-container');
      const previewContent = document.getElementById('batch-preview-content');
      const submitBtn = document.getElementById('btn-submit-draft-batch');

      if (!checkboxes || checkboxes.length === 0) {
        if (previewContainer) previewContainer.style.display = 'none';
        if (submitBtn) submitBtn.disabled = true;
        return;
      }

      const orderContributions = [];
      checkboxes.forEach(cb => {
        orderContributions.push({
          orderId: Number(cb.value),
          contributionMinor: Number(cb.dataset.amount),
        });
      });

      try {
        const res = await fetch('/api/admin/platform-finance/batches/preview', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({ platform, orderContributions }),
        });
        const data = await res.json();
        if (!res.ok) return;

        const p = data.preview;
        previewContainer.style.display = 'block';

        const totalUsd = (p.totalContributionsMinor / 100).toFixed(2);
        const batchFeeUsd = (p.estimatedBatchFeeMinor / 100).toFixed(2);
        const transferFeeUsd = (p.estimatedTransferFeeMinor / 100).toFixed(2);
        const netUsd = (p.expectedNetMinor / 100).toFixed(2);
        const minThreshUsd = (p.minThresholdMinor / 100).toFixed(2);

        previewContent.innerHTML = `
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.5rem; margin-bottom: 0.5rem;">
            <div><strong>Selected Orders:</strong> ${p.orderCount}</div>
            <div><strong>Total Gross:</strong> $${totalUsd}</div>
            <div><strong>Batch Fee:</strong> $${batchFeeUsd}</div>
            <div><strong>Transfer Cost:</strong> $${transferFeeUsd}</div>
            <div><strong>Expected Net:</strong> <span style="font-weight: 700; color: var(--accent-green);">$${netUsd}</span></div>
          </div>
          <div style="margin-top: 0.3rem;">
            ${p.meetsMinimumThreshold ? `
              <span class="badge badge-green">✅ Meets Minimum Threshold ($${minThreshUsd})</span>
            ` : `
              <span class="badge badge-amber">⚠️ Below Platform Minimum of $${minThreshUsd} (Cannot Submit until satisfied)</span>
            `}
          </div>
        `;

        if (submitBtn) {
          submitBtn.disabled = false;
        }
      } catch (err) {
        console.error('Preview error:', err);
      }
    }

    async function submitRecordReceipt(batchId) {
      const receivedVal = parseFloat(document.getElementById('rec-actual-received')?.value || '0');
      const batchFeeVal = parseFloat(document.getElementById('rec-batch-fee')?.value || '0');
      const transferFeeVal = parseFloat(document.getElementById('rec-transfer-fee')?.value || '0');
      const destAccount = document.getElementById('rec-dest-account')?.value?.trim();
      const evidenceRef = document.getElementById('rec-evidence-ref')?.value?.trim();
      const externalRef = document.getElementById('rec-external-ref')?.value?.trim();
      const notes = document.getElementById('rec-notes')?.value?.trim();

      if (isNaN(receivedVal) || receivedVal <= 0) return alert('Enter a valid received amount > 0');
      if (!destAccount) return alert('Destination account reference is required');
      if (!evidenceRef) return alert('Safe evidence reference (TXID/Receipt) is required');

      try {
        const res = await fetch(`/api/admin/platform-finance/batches/${batchId}/record-receipt`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({
            actualReceivedMinor: Math.round(receivedVal * 100),
            actualBatchFeeMinor: Math.round(batchFeeVal * 100),
            actualTransferFeeMinor: Math.round(transferFeeVal * 100),
            destinationAccountRef: destAccount,
            safeEvidenceRef: evidenceRef,
            externalReceiptRef: externalRef,
            reviewNotes: notes,
          }),
        });

        const data = await res.json();
        if (!res.ok) return alert(data.error || 'Failed to record receipt');

        alert(`Receipt confirmed for batch ${data.batch.batchRef}. Status: ${data.batch.status}`);
        closeAdminModal();
        loadAdminPlatformFinance();
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadAdminGamesData() {
      const gamesTable = document.getElementById('games-table-container');
      const servicesTable = document.getElementById('services-table-container');
      if (gamesTable) gamesTable.innerHTML = '<div class="loading-spinner"></div> Loading games...';
      if (servicesTable) servicesTable.innerHTML = '<div class="loading-spinner"></div> Loading service categories...';

      try {
        const res = await fetch('/api/admin/games', { credentials: 'include' });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }
        const data = await res.json();
        adminGamesCache = data.games || [];

        // Update KPIs
        const totalGames = adminGamesCache.length;
        const activeGames = adminGamesCache.filter(g => g.isActive).length;
        let totalServices = 0;
        let activeServices = 0;
        adminGamesCache.forEach(g => {
          (g.services || []).forEach(s => {
            totalServices++;
            if (s.isActive) activeServices++;
          });
        });

        const kpiTotalG = document.getElementById('kpi-total-games');
        const kpiActiveG = document.getElementById('kpi-active-games');
        const kpiTotalS = document.getElementById('kpi-total-services');
        const kpiActiveS = document.getElementById('kpi-active-services');
        if (kpiTotalG) kpiTotalG.textContent = totalGames;
        if (kpiActiveG) kpiActiveG.textContent = activeGames;
        if (kpiTotalS) kpiTotalS.textContent = totalServices;
        if (kpiActiveS) kpiActiveS.textContent = activeServices;

        // Update Filter Select
        const filterSelect = document.getElementById('game-filter-select');
        if (filterSelect) {
          const curVal = selectedGameFilter;
          filterSelect.innerHTML = `<option value="all" ${curVal === 'all' ? 'selected' : ''}>All Games (${totalGames})</option>` +
            adminGamesCache.map(g => `<option value="${g.slug}" ${curVal === g.slug ? 'selected' : ''}>${escapeHtml(g.displayName)} (${(g.services || []).length})</option>`).join('');
        }

        renderGamesTable();
        renderServicesTable();
      } catch (err) {
        if (gamesTable) gamesTable.innerHTML = `<div style="color: var(--accent-red); padding: 1rem;">Failed to load catalog: ${escapeHtml(err.message)}</div>`;
        if (servicesTable) servicesTable.innerHTML = `<div style="color: var(--accent-red); padding: 1rem;">Failed to load services: ${escapeHtml(err.message)}</div>`;
      }
    }

    function onGameFilterChange(val) {

    }

    async function saveGame(event, isEdit, slug) {
      event.preventDefault();
      const errBox = document.getElementById('game-form-error');
      const submitBtn = document.getElementById('game-form-submit-btn');
      if (errBox) errBox.style.display = 'none';
      if (submitBtn) submitBtn.disabled = true;

      try {
        const displayName = document.getElementById('game-displayName').value.trim();
        const serviceCategory = document.getElementById('game-serviceCategory').value;
        const description = document.getElementById('game-description').value.trim() || null;
        const sortOrder = parseInt(document.getElementById('game-sortOrder').value, 10) || 0;
        const isActive = document.getElementById('game-isActive').checked;

        let url = '/api/admin/games';
        let method = 'POST';
        let payload = {};

        if (isEdit) {
          url = `/api/admin/games/${encodeURIComponent(slug)}`;
          method = 'PUT';
          payload = { displayName, serviceCategory, description, sortOrder, isActive };
        } else {
          const newSlug = document.getElementById('game-slug').value.trim();
          const name = document.getElementById('game-name').value.trim();
          payload = { slug: newSlug, name, displayName, serviceCategory, description, sortOrder, isActive };
        }

        const res = await fetch(url, {
          method,
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || ''
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        closeGameCategoryModal();
        await loadAdminGamesData();
      } catch (err) {
        if (errBox) {
          errBox.textContent = err.message;
          errBox.style.display = 'block';
        } else {
          alert(err.message);
        }
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    async function saveService(event, isEdit, gameSlug, serviceId) {
      event.preventDefault();
      const errBox = document.getElementById('service-form-error');
      const submitBtn = document.getElementById('service-form-submit-btn');
      if (errBox) errBox.style.display = 'none';
      if (submitBtn) submitBtn.disabled = true;

        const displayName = document.getElementById('service-displayName').value.trim();
        const serviceMode = document.getElementById('service-mode').value;
        const profileMode = document.getElementById('service-profileMode').value;
        const description = document.getElementById('service-description').value.trim() || null;
        const sortOrder = parseInt(document.getElementById('service-sortOrder').value, 10) || 0;
        const isActive = document.getElementById('service-isActive').checked;
        const requiresPilotApproval = document.getElementById('service-pilotApproval').checked;

        const settings = {
          claimWindowSeconds: parseInt(document.getElementById('setting-claimWindow').value, 10) || 300,
          proofRequired: document.getElementById('setting-proofRequired').checked,
          allowPause: document.getElementById('setting-allowPause').checked,
          allowReplacement: document.getElementById('setting-allowReplacement').checked,
          acceptsSquads: document.getElementById('setting-acceptsSquads').checked,
          requiresKey: document.getElementById('setting-requiresKey').checked,
          requiresRoles: document.getElementById('setting-requiresRoles').checked
        };

        let url = `/api/admin/games/${encodeURIComponent(gameSlug)}/services`;
        let method = 'POST';
        let payload = {};

        if (isEdit) {
          url = `/api/admin/services/${serviceId}`;
          method = 'PUT';
          payload = { displayName, serviceMode, profileMode, requiresPilotApproval, description, sortOrder, isActive, settings };
        } else {
          const serviceKey = document.getElementById('service-key').value.trim();
          payload = { serviceKey, displayName, serviceMode, profileMode, requiresPilotApproval, description, sortOrder, isActive, settings };
        }

        const res = await fetch(url, {
          method,
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || ''
          },
          body: JSON.stringify(payload)
        });

        }
      } finally {

      }

    async function adminMoveGame(slug, direction) {
      const idx = adminGamesCache.findIndex(g => g.slug === slug);
      if (idx === -1) return;
      if (direction === 'up' && idx === 0) return;
      if (direction === 'down' && idx === adminGamesCache.length - 1) return;

      const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
      const copy = [...adminGamesCache];
      const temp = copy[idx];
      copy[idx] = copy[targetIdx];
      copy[targetIdx] = temp;

      const orderedSlugs = copy.map(g => g.slug);

      try {
        const res = await fetch('/api/admin/games/reorder', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || ''
          },
          body: JSON.stringify({ orderedSlugs })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        await loadAdminGamesData();
      } catch (err) {
        alert(err.message);
      }
    }

    async function adminMoveService(gameSlug, serviceId, direction) {
      const game = adminGamesCache.find(g => g.slug === gameSlug);
      if (!game || !game.services) return;

      const services = [...game.services];
      const idx = services.findIndex(s => s.id === serviceId);
      if (idx === -1) return;
      if (direction === 'up' && idx === 0) return;
      if (direction === 'down' && idx === services.length - 1) return;

      const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
      const temp = services[idx];
      services[idx] = services[targetIdx];
      services[targetIdx] = temp;

      const orderedServiceIds = services.map(s => s.id);

      try {
        const res = await fetch('/api/admin/services/reorder', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || ''
          },
          body: JSON.stringify({ gameSlug, orderedServiceIds })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    async function submitIrtEvidence() {
      const trackingNumber = document.getElementById('irt-tracking-num').value.trim();
      const paidAmountIrt = Number(document.getElementById('irt-paid-amount').value);
      const senderCardLast4 = document.getElementById('irt-sender-last4').value.trim();
      const receiptScreenshotUrl = document.getElementById('irt-screenshot-url').value.trim();
      const feedback = document.getElementById('irt-evidence-feedback');

      if (!trackingNumber) {
        feedback.innerHTML = '<span style="color: var(--accent-red);">Please enter the bank tracking number.</span>';
        return;
      }
      if (!paidAmountIrt || paidAmountIrt <= 0) {
        feedback.innerHTML = '<span style="color: var(--accent-red);">Please enter a valid amount paid in IRT.</span>';
        return;
      }
      if (!/^\d{4}$/.test(senderCardLast4)) {
        feedback.innerHTML = '<span style="color: var(--accent-red);">Sender card suffix must be exactly 4 numeric digits.</span>';
        return;
      }

      feedback.innerHTML = '<span class="loading-spinner"></span> Initializing attempt &amp; submitting evidence...';

      try {
        // ۱. ایجاد attempt برای IRT
        const attRes = await fetch(`/api/payments/requests/${currentPaymentRequest.id}/attempts/irt`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
        });

        const attData = await attRes.json();
        if (!attRes.ok || !attData.success) {
          feedback.innerHTML = `<span style="color: var(--accent-red);">${attData.error || 'Failed to create payment attempt'}</span>`;
          return;
        }

        const attemptRef = attData.attempt.attemptRef;

        // ۲. ارسال مدارک برای attempt
        const subRes = await fetch(`/api/payments/attempts/${attemptRef}/irt-evidence`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({
            trackingNumber,
            paidAmountIrt,
            senderCardLast4,
            receiptScreenshotUrl: receiptScreenshotUrl || undefined,
          }),
        });

        const subData = await subRes.json();
        if (!subRes.ok || !subData.success) {
          feedback.innerHTML = `<span style="color: var(--accent-red);">${subData.error || 'Failed to submit evidence'}</span>`;
          return;
        }

        feedback.innerHTML = `
          <div style="background: rgba(16, 185, 129, 0.15); color: var(--accent-green); padding: 0.75rem; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.3);">
            <strong>Success!</strong> ${subData.message}
            <div style="font-size: 0.8rem; margin-top: 0.25rem;">Attempt Ref: <code>${attemptRef}</code></div>
          </div>
        `;
      } catch (err) {
        feedback.innerHTML = `<span style="color: var(--accent-red);">${err.message}</span>`;
      }
    }

            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.75rem;">
              Send the exact crypto amount within the fixed-rate window. Once detected on the blockchain, payment status will transition automatically.
            </div>
            <button class="btn btn-secondary" style="margin-top: 1rem; width: 100%;" onclick="refreshCryptoAttempt('${att.attemptRef}')">
              Check Status
            </button>
          </div>
        `;
      } catch (err) {
        feedback.innerHTML = `<span style="color: var(--accent-red);">${err.message}</span>`;
      }
    }

    async function refreshCryptoAttempt(attemptRef) {
      const badge = document.getElementById('crypto-status-badge');
      if (badge) badge.innerText = 'CHECKING...';
      try {
        const res = await fetch(`/api/payments/attempts/${attemptRef}/status`, { credentials: 'include' });
        const data = await res.json();
        if (res.ok && data.success) {
          const st = data.attempt.status;
          if (badge) {
            badge.innerText = st.toUpperCase();
            if (st === 'finished') {
              badge.className = 'badge badge-green';
              alert('Payment settled and confirmed! Refreshing request...');
              lookupPayment();
            } else if (st === 'partially_paid') {
              badge.className = 'badge badge-red';
            } else {
              badge.className = 'badge badge-amber';
            }
          }
        }
      } catch (err) {
        if (badge) badge.innerText = 'ERROR';
      }
    }

    // ─── Admin Payment Review Hub Handlers ─────────────────────────────────────
    async function loadAdminPayments() {
      const container = document.getElementById('admin-payments-table');
      if (!container) return;

      try {
        const res = await fetch('/api/admin/payments/pending', { credentials: 'include' });
        const data = await res.json();
        const attempts = data.attempts || [];

        if (attempts.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No pending payment evidence awaiting review.</p>';
          return;
        }

        container.innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Attempt</th>
                  <th>Purpose</th>
                  <th>Method</th>
                  <th>Expected</th>
                  <th>Tracking / Card</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${attempts.map(att => {
                  const req = att.paymentRequest || {};
                  const isIrt = att.method === 'CARD_TO_CARD_IRT';
                  const isDuplicateWarn = att.status === 'manual_review' || (att.reviewReason && att.reviewReason.includes('DUPLICATE'));
                  return `
                    <tr style="${isDuplicateWarn ? 'background: rgba(239, 68, 68, 0.08);' : ''}">
                      <td>
                        <strong>${att.attemptRef}</strong><br />
                        <span style="font-size: 0.75rem; color: var(--text-muted);">${new Date(att.createdAt).toLocaleString()}</span>
                      </td>
                      <td>
                        ${req.businessType === 'ORDER' ? `Order #${req.orderId}` : `Funding #${req.fundingRequestId}`}<br />
                        <span style="font-size: 0.75rem; color: var(--accent-green);">$${((req.amountUsdCents || 0) / 100).toFixed(2)}</span>
                      </td>
                      <td>
                        <span class="badge ${isIrt ? 'badge-blue' : 'badge-purple'}">${att.method}</span>
                      </td>
                      <td>
                        <strong>${Number(att.expectedAmount).toLocaleString()} ${att.expectedCurrency}</strong>
                      </td>
                      <td>
                        ${att.trackingNumber ? `Ref: <code>${att.trackingNumber}</code><br />` : ''}
                        ${att.senderCardLast4 ? `Card Suffix: <strong>*${att.senderCardLast4}</strong>` : ''}
                        ${att.receiptScreenshotUrl ? `<br /><a href="${att.receiptScreenshotUrl}" target="_blank" style="font-size:0.75rem; color:var(--primary);">View Screenshot</a>` : ''}
                        ${isDuplicateWarn ? `<div style="color:var(--accent-red); font-size:0.75rem; font-weight:700;">⚠ ${att.reviewReason || 'Flagged duplicate'}</div>` : ''}
                      </td>
                      <td>
                        <span class="badge ${att.status === 'manual_review' ? 'badge-red' : 'badge-amber'}">${att.status.toUpperCase()}</span>
                      </td>
                      <td>
                        ${isIrt ? `
                          <button class="btn btn-success" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="adminApproveIrt(${att.id}, ${att.expectedAmount})">
                            Approve
                          </button>
                          <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="adminRejectIrt(${att.id})">
                            Reject
                          </button>
                        ` : `
                          <span style="color: var(--text-muted); font-size: 0.75rem;">Automated IPN</span>
                        `}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<span style="color: var(--accent-red);">${err.message}</span>`;
      }
    }

    async function adminApproveIrt(attemptId, expectedAmount) {
      const actualStr = prompt(`Confirm actual received IRT funds from bank statement (Expected: ${Number(expectedAmount).toLocaleString()} IRT):`, expectedAmount);
      if (!actualStr) return;

      const actualAmountReceivedIrt = Number(actualStr.replace(/,/g, ''));
      if (isNaN(actualAmountReceivedIrt) || actualAmountReceivedIrt <= 0) {
        alert('Invalid amount entered.');
        return;
      }

      try {
        const res = await fetch(`/api/admin/payments/attempts/${attemptId}/review`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({
            action: 'APPROVE',
            actualAmountReceivedIrt,
          }),
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          alert(`Approval failed: ${data.error || 'Unknown error'}`);
          return;
        }

        alert(`Payment approved successfully! Verified receipt #${data.receipt?.receiptRef} issued and order funded.`);
        loadAdminPayments();
        loadAdminReceipts();
      } catch (err) {
        alert(err.message);
      }
    }

    async function adminRejectIrt(attemptId) {
      const reason = prompt('Enter mandatory rejection reason (required by financial security policy):');
      if (!reason || reason.trim().length < 5) {
        alert('Rejection requires an explicit reason of at least 5 characters.');
        return;
      }

      try {
        const res = await fetch(`/api/admin/payments/attempts/${attemptId}/review`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken || '' },
          body: JSON.stringify({
            action: 'REJECT',
            reason: reason.trim(),
          }),
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          alert(`Rejection failed: ${data.error || 'Unknown error'}`);
          return;
        }

        alert('Payment attempt rejected successfully.');
        loadAdminPayments();
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadAdminReceipts() {
      const container = document.getElementById('admin-receipts-table');
      if (!container) return;

      try {
        const res = await fetch('/api/admin/payments/receipts', { credentials: 'include' });
        const data = await res.json();
        const receipts = data.receipts || [];

        if (receipts.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No verified payment receipts issued yet.</p>';
          return;
        }

        container.innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Receipt Ref</th>
                  <th>Amount (USD)</th>
                  <th>Method</th>
                  <th>Provider Ref / Tx</th>
                  <th>Verified By</th>
                  <th>Consumed By</th>
                  <th>Verified At</th>
                </tr>
              </thead>
              <tbody>
                ${receipts.map(r => `
                  <tr>
                    <td><strong>${r.receiptRef}</strong></td>
                    <td style="color: var(--accent-green); font-weight: 700;">$${(r.amountUsdCents / 100).toFixed(2)}</td>
                    <td><span class="badge">${r.paymentMethod}</span></td>
                    <td><code style="font-size: 0.8rem;">${r.providerReference}</code></td>
                    <td>${r.verifiedBy}</td>
                    <td>
                      <span class="badge ${r.status === 'CONSUMED' ? 'badge-green' : 'badge-amber'}">${r.consumedAction || r.status}</span>
                      ${r.consumedReferenceId ? `<br /><span style="font-size:0.75rem; color:var(--text-muted);">${r.consumedReferenceId}</span>` : ''}
                    </td>
                    <td style="font-size: 0.8rem; color: var(--text-muted);">${new Date(r.verifiedAt).toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<span style="color: var(--accent-red);">${err.message}</span>`;
      }
    }

    // Start authentication check on load
    checkAuth();
  </script>
</body>
</html>
