<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G4X Community — Booster & Member Portal</title>
  <meta name="description" content="G4X Community booster portal. Securely track orders, earnings, and character statuses." />
  <style>
    :root {
      --bg-dark: #0f1117;
      --card-bg: #181c27;
      --card-border: #262c3d;
      --primary: #5865f2;
      --primary-hover: #4752c4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand span {
      color: var(--primary);
    }

    .user-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-discord {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-discord:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #2b3145;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #38405a;
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.25);
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      margin-top: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: var(--text-muted);
    }

    .stat-val {
      font-weight: 600;
      color: #fff;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
      background: #2b3145;
      color: var(--text-muted);
    }

    .badge-green {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      G4X <span>COMMUNITY</span>
    </div>
    <div class="user-nav" id="nav-container">
      <div class="loading-spinner"></div>
    </div>
  </header>

  <main id="main-content">
    <!-- Rendered dynamically -->
  </main>

  <footer>
    &copy; 2026 G4X Community. High Performance Operations & Security.
  </footer>

  <script>
    let currentUser = null;
    let csrfToken = null;

    async function fetchCsrfToken() {
      try {
        const res = await fetch('/api/csrf-token', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          csrfToken = data.csrfToken;
        }
      } catch (err) {
        console.error('Failed to fetch CSRF token', err);
      }
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        if (res.ok) {
          currentUser = await res.json();
          await fetchCsrfToken();
          renderDashboard();
        } else {
          currentUser = null;
          renderLogin();
        }
      } catch (err) {
        currentUser = null;
        renderLogin();
      }
    }

    async function handleLogout() {
      try {
        await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken || ''
          }
        });
      } catch (err) {
        console.error('Logout error', err);
      } finally {
        window.location.href = '/';
      }
    }

    function renderLogin() {
      const nav = document.getElementById('nav-container');
      nav.innerHTML = `
        <a href="/auth/discord" class="btn btn-discord" id="login-btn">
          Login with Discord
        </a>
      `;

      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="hero-card">
          <h1 class="hero-title">Welcome to G4X Community</h1>
          <p class="hero-desc">
            The premier platform for high-tier game operations, Mythic+ boosting, and automated escrow settlement.
            Please authenticate using your verified Discord account to access your dashboard.
          </p>
          <a href="/auth/discord" class="btn btn-discord" style="font-size: 1.05rem; padding: 0.8rem 2rem;">
            Authenticate via Discord OAuth2
          </a>
        </div>
      `;
    }

    async function renderDashboard() {
      const nav = document.getElementById('nav-container');
      nav.innerHTML = `
        <span style="font-size: 0.9rem; font-weight: 600;">${currentUser.displayName || currentUser.username}</span>
        <button class="btn btn-danger" onclick="handleLogout()" id="logout-btn">Logout</button>
      `;

      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h2 style="font-size: 1.75rem; font-weight: 800;">Member Dashboard</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Authenticated as @${currentUser.username} (${currentUser.discordId})</p>
          </div>
          <div>
            <span class="badge badge-green">Session Active</span>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card" id="wallet-card">
            <div class="card-title">
              <span>Financial Balances</span>
              <span class="badge">Escrow 72h</span>
            </div>
            <div id="wallet-data">
              <div class="loading-spinner"></div>
            </div>
          </div>

          <div class="card" id="roles-card">
            <div class="card-title">
              <span>Account Roles</span>
              <span class="badge">Security RBAC</span>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
              ${currentUser.roles && currentUser.roles.length > 0 
                ? currentUser.roles.map(r => `<span class="badge badge-green">${r}</span>`).join('') 
                : '<span style="color: var(--text-muted); font-size: 0.9rem;">Standard Member</span>'}
            </div>
          </div>
        </div>
      `;

      loadWallet();
    }

    async function loadWallet() {
      const container = document.getElementById('wallet-data');
      try {
        const res = await fetch('/api/wallet', { credentials: 'include' });
        if (res.ok) {
          const w = await res.json();
          container.innerHTML = `
            <div class="stat-row">
              <span class="stat-label">Available Balance (USD)</span>
              <span class="stat-val">$${(w.balanceUsd / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Escrow Locked (USD)</span>
              <span class="stat-val">$${(w.escrowUsd / 100).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Gold Balance</span>
              <span class="stat-val">${w.balanceGold.toLocaleString()} g</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">IRT Balance</span>
              <span class="stat-val">${w.balanceIrt.toLocaleString()} IRT</span>
            </div>
          `;
        } else {
          container.innerHTML = `<span style="color: var(--accent-red); font-size: 0.9rem;">Failed to load wallet.</span>`;
        }
      } catch (err) {
        container.innerHTML = `<span style="color: var(--accent-red); font-size: 0.9rem;">Wallet service unavailable.</span>`;
      }
    }

    // Initialize application
    checkAuth();
  </script>
</body>
</html>
